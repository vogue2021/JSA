name = "jsa-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── 生产环境（默认）─────────────────────────────────────────────────────────────
# 部署命令：npx wrangler deploy
[[d1_databases]]
binding = "DB"
database_name = "jsa-db"
database_id = "9e0f50c0-e85b-4eef-a5e8-f5461965d823"

# 【新需求77/83】R2 对象存储 - 站内消息系统的图片上传
# 生产 bucket 已在 Cloudflare 控制台创建，名为 prd-mingxue
[[r2_buckets]]
binding = "R2_UPLOADS"
bucket_name = "prd-mingxue"

# ─── 测试环境 ─────────────────────────────────────────────────────────────────
# 部署命令：npx wrangler deploy --env staging
[env.staging]
name = "jsa-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "jsa-db-staging"
database_id = "ec330b28-9f0a-4e8a-9bfc-3550eb311903"

# 【新需求77】R2 对象存储（staging 已在 Cloudflare 控制台创建，bucket 名为 staging-mingxue）
[[env.staging.r2_buckets]]
binding = "R2_UPLOADS"
bucket_name = "staging-mingxue"
